[project]
name = "frogger-dqn-lab"
version = "0.1.0"
description = "From-scratch DQN (PyTorch + Gymnasium) learning ALE/Frogger-v5 from RAM observations"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ale-py==0.12.1",
    "gymnasium>=1.0,<2",
    "torch",
    "numpy",
    "matplotlib",
    "imageio>=2.38.1",
    "pillow>=12.3.0",
    "opencv-python-headless>=5.0.0.93",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.sources]
# Windows/Linux get the CUDA 12.8 wheels; macOS has no such index and uses PyPI torch (MPS).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
